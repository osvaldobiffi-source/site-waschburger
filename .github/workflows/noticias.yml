name: Atualizar notícias

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 6h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/atualizar_noticias.py
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "Atualiza notícias" && git push)
